name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      configured-release:
        type: boolean
        default: false
    secrets:
      SERVICE_CONFIG_JSON:
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows checks and portable build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - if: ${{ !inputs.configured-release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.96-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Restore unconfigured build cache without saving injected settings
        if: ${{ inputs.configured-release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-1.96-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Audit, test, lint and build
        shell: pwsh
        env:
          OPENRIDESYNC_SERVICE_CONFIG: ${{ secrets.SERVICE_CONFIG_JSON }}
          CONFIGURED_RELEASE: ${{ inputs.configured-release }}
        run: ./build.ps1 -RequireServiceConfig:($env:CONFIGURED_RELEASE -eq 'true')
      - name: Upload portable package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: release/OpenRideSync-Viewer-*-windows-x64.zip*
          if-no-files-found: error
          retention-days: 14
