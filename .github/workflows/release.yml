name: Release
on:
  push:
    tags: ['V*', 'v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml
    with:
      configured-release: true
    secrets:
      SERVICE_CONFIG_JSON: ${{ secrets.ROADSYNC_SERVICE_CONFIG }}
  publish:
    name: Publish verified Windows release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release
      - name: Verify checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$RELEASE_TAG" == "V$version" || "$RELEASE_TAG" == "v$version" ]]
          archive="OpenRideSync-Viewer-$version-windows-x64.zip"
          (cd release && sha256sum --check "$archive.sha256")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OpenRideSync Viewer $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "release/$archive" "release/$archive.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
